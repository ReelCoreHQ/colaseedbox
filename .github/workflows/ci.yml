name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 这个名字就是分支保护里要求的 status check（main 必须先过它才能合并）
    name: functional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 读搬运记录
        id: vendor
        run: echo "commit=$(python -c 'import json;print(json.load(open("app/seedgroup/VENDOR.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      # 执行器逻辑只能来自插件仓库：检出 VENDOR.json 记的那个 commit，逐字节比对
      - name: 检出插件仓库（搬运来源）
        uses: actions/checkout@v4
        with:
          repository: ReelCoreHQ/moviepilot-plugin-colaseedgroup
          ref: ${{ steps.vendor.outputs.commit }}
          path: _plugin
          persist-credentials: false

      - name: 搬运校验（与插件逐字节一致）
        run: python scripts/check_vendor.py --source _plugin

      - name: ruff
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -s tests -v
