# 构建独立版镜像并冒烟；main 上冒烟通过后推到 GHCR：
#   ghcr.io/reelcorehq/colaseedgroup-docker:<版本>（取自 app/seedgroup/VENDOR.json 的 plugin_version）、:latest、:sha-<短提交>
#   linux/amd64 + linux/arm64（群晖 / 威联通 / 树莓派等 ARM NAS 也能直接拉）。
# PR 只构建与冒烟，不推送。
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: colaseedgroup-docker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟：容器能起来、/api/health 正常、镜像里没有 curl
        run: |
          docker run -d --name smoke -p 3006:3006 colaseedgroup-docker:ci
          ok=
          for i in $(seq 1 30); do
            if body=$(python3 -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:3006/api/health',timeout=3).read().decode())" 2>/dev/null); then
              ok=1; echo "$body"; break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "容器没起来，日志："; docker logs smoke; exit 1; }
          echo "$body" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['ok'] and d['service']=='colaseedgroup-docker',d"
          ! docker exec smoke sh -c 'command -v curl'
          # 面板要登录：初始密码只在日志里出现一次，data 里只有哈希（0600）
          [ "$(docker logs smoke 2>&1 | grep -c '初始登录密码：')" = 1 ]
          pw=$(docker logs smoke 2>&1 | sed -n 's/.*初始登录密码：\([^（]*\)（.*/\1/p')
          [ -n "$pw" ]
          echo "::add-mask::$pw"
          docker exec smoke sh -c 'stat -c %a /data/auth.json' | grep -qx 600
          ! docker exec smoke grep -qF -- "$pw" /data/auth.json
          # 未登录 401；登录后：未配置时不连站点、不碰下载器，只提示缺什么
          SG_PW="$pw" python3 - <<'PY'
          import http.cookiejar, json, os, urllib.error, urllib.request
          base = "http://127.0.0.1:3006"
          try:
              urllib.request.urlopen(base + "/api/status")
              raise SystemExit("未登录也能看 /api/status")
          except urllib.error.HTTPError as err:
              assert err.code == 401, err.code
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          req = urllib.request.Request(base + "/api/login", data=json.dumps({"password": os.environ["SG_PW"]}).encode(),
                                       headers={"Content-Type": "application/json"})
          assert opener.open(req).status == 200
          s = json.load(opener.open(base + "/api/status"))
          assert not s["configured"], s
          PY
          docker exec smoke sh -c 'stat -c %a /data/config.json' | grep -qx 600
          docker logs smoke 2>&1 | sed 's/初始登录密码：[^（]*/初始登录密码：***/'

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 版本号
        id: v
        run: |
          v=$(python3 -c "import json;print(json.load(open('app/seedgroup/VENDOR.json'))['plugin_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/reelcorehq/colaseedgroup-docker:${{ steps.v.outputs.version }}
            ghcr.io/reelcorehq/colaseedgroup-docker:latest
            ghcr.io/reelcorehq/colaseedgroup-docker:sha-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
