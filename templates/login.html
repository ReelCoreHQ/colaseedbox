<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 可乐保种组</title>
<link rel="stylesheet" href="/panel.css">
<style>
  /* 组件与设计档位在 /panel.css（照搬 reelcore-ui）；这里只排版 */
  main { width: min(420px, calc(100vw - 32px)); margin: 0 auto; padding: 12vh 0 var(--space-32); }
  .site-brand { display: block; margin-bottom: var(--space-4); }
  .lead { margin: 0 0 var(--space-16); color: var(--text-muted); font-size: var(--text-md); }
  form.panel { display: grid; gap: var(--space-16); }
  form.panel button[type="submit"] { width: 100%; }
  .hint { margin: var(--space-16) 0 0; color: var(--text-muted); font-size: var(--text-xs); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1 class="site-brand">可乐保种组 <small>· Docker 版</small></h1>
  <p class="lead">登录后才能查看状态、修改设置。</p>
  <form class="panel" id="login">
    <div class="field">
      <label for="password">登录密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    <p id="msg" class="action-feedback" role="alert"></p>
    <button type="submit" id="go">登录</button>
  </form>
  <p class="hint">第一次启动时，初始密码只在容器日志里显示一次：<code>docker logs colaseedgroup-docker</code>，找「初始登录密码」。</p>
  <p class="hint">忘了密码：删掉数据目录里的 <code>auth.json</code>（容器里是 <code>/data/auth.json</code>），重启容器，日志里会显示一个新的初始密码。用环境变量 <code>COLASEEDGROUP_PASSWORD</code> 设的密码请直接改环境变量。</p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let timer = null;

function show(tone, text) {
  const m = $("msg");
  m.className = "action-feedback" + (tone === "warning" ? " action-feedback--warning" : "");
  m.textContent = text;
}

function wait(seconds) {
  clearInterval(timer);
  let left = seconds;
  $("go").disabled = true;
  const tick = () => {
    if (left <= 0) { clearInterval(timer); $("go").disabled = false; show("", ""); return; }
    show("warning", `错误次数太多，请 ${left} 秒后再试。`);
    left -= 1;
  };
  tick();
  timer = setInterval(tick, 1000);
}

$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("go").disabled = true;
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({password: $("password").value})});
    const body = await r.json().catch(() => ({}));
    if (r.ok) { location.replace("/"); return; }
    const err = body.error || {};
    $("password").value = "";
    $("password").focus();
    if (r.status === 429) { wait(err.retry_after || 5); return; }
    show("error", r.status === 401 ? "密码不对。" : "登录失败：" + (err.code || r.status));
  } catch (e) {
    show("error", "连不上服务：" + e.message);
  }
  $("go").disabled = false;
});
</script>
</body>
</html>
